<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bakery</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div>
      <div class="Header">
        <div>
          <img src="images/icon.jpeg" alt="Bakery icon" class="Bakery-icon" />
        </div>
        <div>
          <ul class="Items">
            <li>Bakery</li>
            <li>PAGES</li>
            <li>OUR BREAD</li>
            <li>CONTACT</li>
          </ul>
        </div>
        <div class="icons">
          <i class="fa-solid fa-magnifying-glass"></i>
          <i class="fa-solid fa-basket-shopping"></i>
        </div>
      </div>
    </div>
    <div class="hero-container">
      <div class="hero-text">
        <h1 class="hero-header">Bakery Menu</h1>
        <p class="hero-para">
          Nibh venenatis cras sed felis eget velit aliquet sagittis id.Tellus
          pellentesque eu tincidunt tortor aliquam nulla.
        </p>
        <button class="Hero-readmore-button">READ MORE</button>
      </div>
      <div>
        <img
          src="images/background-image.jpeg"
          alt="background-image"
          class="hero-image"
        />
      </div>
    </div>
  </body>
</html>
