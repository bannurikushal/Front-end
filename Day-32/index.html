<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="login-container">
      <img src="assets/usericon.png" alt="usericon" class="usericon" />
      <div class="form-container">
        <div class="inputfields-container">
          <img
            src="assets/usernameicon.png"
            alt="usernameicon"
            class="usernameicon"
          />
          <input type="text" placeholder="Username" id="username" />
        </div>
        <div class="inputfields-container">
          <img src="assets/password.png" alt="password" class="passwordicon" />
          <input type="password" placeholder="Password" id="password" />
        </div>
        <button class="login-button" onclick="getusername()">LOGIN</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
